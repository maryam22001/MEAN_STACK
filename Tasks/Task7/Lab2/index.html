<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" 
        href=
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">
<div class="wrapper">
    <div class="details">
   <div class="now-playing" id="now-playing">PLAYING x OF y</div>

<div class="track-art" id="track-art"></div>

<div class="track-name" id="track-name">Track Name</div>

<div class="track-artist" id="track-artist">Track Artist</div>
    </div>

    <div class="slider_container">
     <div class="current-time" id="current-time">00:00</div>
      <input type="range" min="1" max="100" value="0" class="seek_slider" id="seek-slider" onchange="seekTo()">
    <div class="total-duration" id="total-duration">00:00</div>

    </div>
    <div class="slider_container">
      <i class="fa fa-volume-down"></i>
      <input type="range" min="1" max="100" value="99" class="volume_slider" id="volume-slider">
      <i class="fa fa-volume-up"></i>
    </div>
    <audio id="audio-player" src="audio1.mp3" ></audio>
   
    <div class="buttons">

      <div class="random-track" onclick="randomTrack()">
        <i class="fas fa-random"></i>
      </div>
<div class="prev-track" id="prev" onclick="prevTrack()">
        <i class="fas fa-backward"></i>
      </div>
<div class="playpause-track" id="playpause" onclick="playpauseTrack()">
        <i class="fas fa-play-circle fa-5x"></i>
      </div>
<div class="next-track" id="next" onclick="nextTrack()">
        <i class="fas fa-forward"></i>
      </div>
        <div class="repeat-track" onclick="repeatTrack()">
          <i class="fas fa-redo-alt"></i>
        </div>
<div id="wave">
  <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
</div>
    </div>
    </div>
  </div>
   <script src="script.js"></script> 
</body>
</html>
