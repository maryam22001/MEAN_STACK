<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" 
        href=
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">

    <div class="details">
      <div class="now-playing">PLAYING x OF y</div>
      <div class="track-art"></div>
      <div class="track-name">Track Name</div>
      <div class="track-artist">Track Artist</div>
    </div>
    <div class="slider_container">
      <div class="current-time">00:00</div>
      <input type="range" min="1" max="100" value="0" class="seek_slider" onchange="seekTo()">
      <div class="total-duration">00:00</div>
    </div>
    <div class="slider_container">
      <i class="fa fa-volume-down"></i>
      <input type="range" min="1" max="100" value="99" class="volume_slider">
      <i class="fa fa-volume-up"></i>
    </div>
    <audio id="audio-player" src="audio1.mp3" controls></audio>
    <div class="buttons">

      <i class="fa fa-step-backward fa-2x" id="pre" onclick="prevTrack()"></i>
      <i class="fa fa-play-circle fa-3x" id="playpause" onclick="playpauseTrack()"></i>
      <i class="fa fa-step-forward fa-2x" id="next" onclick="nextTrack()"></i>
    </div>
  </div>
   <script src="script.js"></script> 
</body>
</html>
