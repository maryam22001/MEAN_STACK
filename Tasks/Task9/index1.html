<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Animations</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: sans-serif;
    }

    .section {
      position: relative;
      width: 100%;
      height: 50vh;
      overflow: hidden;
      border-bottom: 2px solid #000;
    }

    .section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      
    }

    .section h2 {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      font-size: 5rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      z-index: 10;
      text-shadow: 2px 2px 20px rgba(0,0,0,0.7);
    }

 
    .desert h2 {
      animation: textFloat 3s ease-in-out infinite;
    }
    @keyframes textFloat {
      0%, 100% { transform: translate(-50%, -50%); } 
      50% { transform: translate(-50%, -70%); }     
    }

   
    .forest h2 {
      animation: textFade 4s ease-in-out infinite;
      transform: translate(-50%, -50%); 
    }
    @keyframes textFade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

   
    .canyon h2 {
      animation: textRotate 5s linear infinite;
    }
    @keyframes textRotate {
   
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

   
    .glacier h2 {
      animation: textScaleVanish 5s ease-in-out infinite;
    }
    @keyframes textScaleVanish {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="section desert">
    <img src="https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?w=1200" alt="Desert">
    <h2>Desert</h2>
  </div>

  <div class="section forest">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200" alt="Forest">
    <h2>Forest</h2>
  </div>

  <div class="section canyon">
    <img src="https://images.unsplash.com/photo-1500673922987-e212871fec22?w=1200" alt="Canyon">
    <h2>Canyon</h2>
  </div>

  <div class="section glacier">
    <img src="https://images.unsplash.com/photo-1473081556163-2a17de81fc97?w=1200" alt="Glacier">
    <h2>Glacier</h2>
  </div>

</body>
</html>
