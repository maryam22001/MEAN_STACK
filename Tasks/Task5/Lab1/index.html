<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Form</title>
    <link rel="stylesheet" href="Lab1.css">
</head>
<body>

<div class="container">
    <form id="loginForm">
        <label>Name:</label>
        <input id="nameLabel" type="text" placeholder="My name is..." required>
        
        <label>Age:</label>
        <input id="ageLabel" type="text" placeholder="I am ... years old" required>
        
        <input type="submit" value="Add to Table">
    </form>
</div>

<div id="table-container">
    <table id="dataTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script src="Lab1.js"></script>
</body>
</html>
